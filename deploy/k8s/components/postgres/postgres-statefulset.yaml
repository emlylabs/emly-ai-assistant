apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emly-postgres
  labels:
    app.kubernetes.io/name: emly-postgres
spec:
  serviceName: emly-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emly-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emly-postgres
    spec:
      serviceAccountName: emly
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # uid 70 is "postgres" in the alpine image; running as it directly
        # skips the entrypoint's root-only chown.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: emly
            - name: POSTGRES_DB
              value: emly
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/POSTGRES_PASSWORD
            # A subdirectory: the volume's root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "emly", "-d", "emly"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "emly", "-d", "emly"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: secrets
          secret:
            secretName: emly-postgres
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
