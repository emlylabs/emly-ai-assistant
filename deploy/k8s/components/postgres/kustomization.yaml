# Optional: run Postgres in the cluster instead of a managed database.
# A managed database (with backups and TLS) is recommended.
#
# Needs a Secret "emly-postgres" with POSTGRES_PASSWORD, and the app's
# DATABASE_URL (in "emly-secrets") pointing at it:
#   postgresql://emly:<password>@emly-postgres:5432/emly
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - postgres-networkpolicy.yaml
